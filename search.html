<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6ef">
  <title>Search Bay Area Parks</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
  <link rel="stylesheet" href="park-map.css">
</head>
<body data-page="search">
  <header class="site-header">
    <div class="topbar">
      <div class="brand" aria-label="Bay Area Parks home">
        <span class="brand-mark" aria-hidden="true">🌳</span>
        <span>Bay Area Parks</span>
      </div>
      <nav class="main-nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html">Explore Map</a>
        <a class="nav-link" href="parks.html">All Parks</a>
        <a class="nav-link active" href="search.html">Search</a>
        <a class="nav-link" href="application.html">Suggest a Park</a>
      </nav>
    </div>
  </header>

  <main class="page-shell search-shell">
    <section class="hero-band scenic-banner compact-scenic" aria-label="Search header">
      <div class="hero-copy">
        <h1>Search parks &amp; amenities</h1>
        <p>Find parks by name, location, or the amenities you're looking for.</p>
      </div>
      <div class="hero-art" aria-hidden="true">
        <svg viewBox="0 0 440 150" role="img" aria-label="Scenic illustration">
          <path d="M0 110 C 90 90, 125 88, 180 106 S 310 96, 440 110 L 440 150 L 0 150 Z" fill="#cfe0c7"/>
          <path d="M0 120 C 72 108, 110 112, 180 118 S 300 120, 440 124 L 440 150 L 0 150 Z" fill="#b7d1b0"/>
          <g fill="#4a7d59">
            <circle cx="80" cy="82" r="18"/>
            <circle cx="105" cy="64" r="16"/>
            <circle cx="128" cy="82" r="17"/>
            <path d="M94 92 L 102 122 L 110 92 Z"/>
          </g>
          <g fill="#5c8d65">
            <circle cx="315" cy="78" r="17"/>
            <circle cx="338" cy="60" r="14"/>
            <circle cx="362" cy="76" r="16"/>
            <path d="M330 84 L 341 120 L 347 84 Z"/>
          </g>
        </svg>
      </div>
    </section>

    <div class="search-bar-row">
      <label class="search-wrap wide-search search-wrap--page" for="park-search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"></circle>
          <path d="m16 16 4.1 4.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        <input id="park-search" type="search" placeholder="Search parks, locations, or amenities..." aria-label="Search parks or amenities">
      </label>
      <button class="search-button" type="button">Search</button>
    </div>

    <div class="search-layout">
      <aside class="filter-panel" aria-label="Park filters">
        <div class="panel-header-row">
          <h2>Filter by Amenities</h2>
          <button class="clear-button" type="button">Clear all</button>
        </div>
        <div class="checkbox-list">
          <label><input type="checkbox"> Playground</label>
          <label><input type="checkbox"> Restrooms</label>
          <label><input type="checkbox"> Picnic Areas</label>
          <label><input type="checkbox"> Sports Fields</label>
          <label><input type="checkbox"> Basketball</label>
          <label><input type="checkbox"> Tennis</label>
          <label><input type="checkbox"> Dog Parks</label>
          <label><input type="checkbox"> Parking</label>
          <label><input type="checkbox"> Drinking Fountains</label>
        </div>
        <div class="city-block">
          <h3>Filter by City</h3>
          <label><input type="checkbox"> San Jose</label>
          <label><input type="checkbox"> Santa Clara</label>
          <label><input type="checkbox"> Oakland</label>
          <label><input type="checkbox"> Berkeley</label>
        </div>
      </aside>

      <section class="results-panel" aria-live="polite">
        <div class="panel-header-row panel-header-row--flattened">
          <strong id="park-count">63 matching parks</strong>
        </div>
        <ul id="park-results" class="search-result-list"></ul>
      </section>

      <aside class="map-preview" aria-label="Park map preview">
        <div id="park-map"></div>
      </aside>
    </div>

    <div id="filter-results" class="filter-results hidden"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script src="park-map.js"></script>
</body>
</html>
