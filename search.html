<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6ef">
  <title>Search Bay Area Parks</title>
  <link rel="stylesheet" href="park-map.css">
</head>
<body data-page="search">
  <header class="hero search-header">
    <div class="topbar">
      <a class="brand" href="index.html" aria-label="Back to park directory">
        <span class="brand-mark" aria-hidden="true">⌁</span>
        OUTSIDE, CLOSE BY
      </a>
      <a class="apply-link" href="application.html">Suggest a park</a>
    </div>
    <div class="hero-copy search-hero-copy">
      <p class="eyebrow">Find your next favorite spot</p>
      <h1>Search parks and amenities</h1>
      <p class="intro">Jump to the parks and filters that match your mood, favorite activity, or neighborhood.</p>
      <span class="hero-leaf" aria-hidden="true">❧</span>
    </div>
  </header>

  <main class="search-main">
    <section class="search-panel" aria-label="Park search panel">
      <label class="search-wrap search-wrap--page">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"></circle>
          <path d="m16 16 4.1 4.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        <input class="search search--page" id="park-search" type="search" placeholder="Search parks, cities, or amenities..." aria-label="Search parks or amenities">
      </label>

      <div class="search-results-layout">
        <div class="search-column">
          <h2>Matching parks</h2>
          <ul id="park-results" class="search-result-list" aria-live="polite"></ul>
        </div>

        <div class="search-column">
          <h2>Matching filters</h2>
          <div id="filter-results" class="search-tags search-tags--page" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="park-map.js"></script>
</body>
</html>
